<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReliefDesk – Disaster Assistance Requests</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--surface:#fff;--ink:#14232e;--mute:#566b79;--line:#d3dde4;--accent:#0e7c7b;--accent-ink:#fff;--crit:#c9302a;--high:#d9772b;--med:#b58a00;--low:#4a7c59;--focus:#1a56db;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--surface:#17252f;--ink:#e8f0f5;--mute:#9bb0be;--line:#2b3d4a;--accent:#3fb8b6;--accent-ink:#06201f;--crit:#ff6b63;--high:#ffa25a;--med:#e8c24a;--low:#7ecb93;--focus:#7aa7ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a22;--surface:#17252f;--ink:#e8f0f5;--mute:#9bb0be;--line:#2b3d4a;--accent:#3fb8b6;--accent-ink:#06201f;--crit:#ff6b63;--high:#ffa25a;--med:#e8c24a;--low:#7ecb93;--focus:#7aa7ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1000px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:13px;font-weight:400;color:var(--mute)}
nav{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px}
nav button{font:inherit;border:0;background:none;color:var(--mute);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700}
nav button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 10px}
.lead{color:var(--mute);margin:0 0 20px;max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.full{grid-column:1/-1}
label,.lbl{display:block;font-weight:700;margin-bottom:4px;font-size:15px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{margin:0;font-weight:400}
.opts input{position:absolute;opacity:0;width:1px;height:1px}
.opts span{display:inline-block;padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;background:var(--bg);user-select:none}
.opts input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.opts input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:14px;color:var(--mute);margin-top:4px}
.err{color:var(--crit);font-size:14px;margin-top:4px}
.ok{border-left:6px solid var(--low)}
.tid{font-size:30px;font-weight:700;letter-spacing:.04em}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;border:1.5px solid currentColor}
.p-Critical{color:var(--crit)}.p-High{color:var(--high)}.p-Medium{color:var(--med)}.p-Low{color:var(--low)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{font-size:26px;display:block;line-height:1.1}
.stat span{color:var(--mute);font-size:14px}
.req{border:1px solid var(--line);border-left-width:6px;border-radius:10px;background:var(--surface);padding:14px;margin-bottom:10px}
.req.b-Critical{border-left-color:var(--crit)}.req.b-High{border-left-color:var(--high)}.req.b-Medium{border-left-color:var(--med)}.req.b-Low{border-left-color:var(--low)}
.req h3{margin:0;font-size:17px}
.meta{color:var(--mute);font-size:14px}
.tags span{font-size:13px;background:var(--bg);border-radius:6px;padding:1px 8px;margin-right:4px}
.steps{display:flex;gap:6px;margin:12px 0}
.steps div{flex:1;text-align:center;padding:8px 4px;border-radius:8px;background:var(--bg);color:var(--mute);font-size:14px}
.steps .done{background:var(--accent);color:var(--accent-ink);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select{width:auto}
.empty{text-align:center;color:var(--mute);padding:30px}
.note{font-size:14px;color:var(--mute)}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:9}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand">ReliefDesk<small>Disaster assistance requests</small></div>
  <nav role="tablist" aria-label="Sections">
    <button role="tab" data-t="request" aria-selected="true">Ask for help</button>
    <button role="tab" data-t="track" aria-selected="false">Track request</button>
    <button role="tab" data-t="dash" aria-selected="false">Responder desk</button>
  </nav>
</div></header>
<main id="app"></main>

<script>
const TYPES=["Rescue","Medical","Food & water","Shelter","Power & comms","Other"];
const URG=["Critical","High","Medium","Low"];
const STATUS=["New","Assigned","In progress","Resolved"];
const TEAMS=["Unassigned","Rescue Team A","Rescue Team B","Medical Unit 1","Supply Convoy","Shelter Desk"];
const VULN=["Elderly","Children","Disabled","Medical condition","Pregnant"];
let tab="request",lastId=null,trackId="",trackRes=null,trackErr="",filter={status:"Open",type:"All"},list=[],dashErr="";
let token=null;try{token=sessionStorage.getItem("rd-token")}catch(e){}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago=t=>{const m=Math.max(1,Math.round((Date.now()-t)/60000));return m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
async function api(path,opts={}){
  const h={"Content-Type":"application/json"};if(token)h.Authorization="Bearer "+token;
  const r=await fetch("/api"+path,{...opts,headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&token){logout(false)}
  if(!r.ok)throw Object.assign(new Error(j.error||"Something went wrong."),{errors:j.errors,status:r.status});
  return j;
}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function logout(go=true){token=null;try{sessionStorage.removeItem("rd-token")}catch(e){}if(go){render()}}

function viewRequest(){
  const done=lastId;
  return `<h1>Ask for help</h1>
  <p class="lead">Tell us where you are and what you need. A responder will pick this up in order of urgency. If someone’s life is in immediate danger, also call 112.</p>
  ${done?`<div class="panel ok" style="margin-bottom:16px"><div class="meta">Request received. Your tracking ID is</div><div class="tid">${done}</div>
  <p class="meta" style="margin:4px 0 10px">Save this ID. Use “Track request” to see updates.</p><button class="btn sm" id="goTrack">Track this request</button></div>`:""}
  <form id="f" class="panel grid" novalidate>
    <div class="full"><span class="lbl">What do you need?</span><div class="opts" role="radiogroup">${TYPES.map((t,i)=>`<label><input type="radio" name="type" value="${t}" ${i===0?"checked":""}><span>${t}</span></label>`).join("")}</div></div>
    <div class="full"><span class="lbl">How urgent is it?</span><div class="opts" role="radiogroup">${URG.map(u=>`<label><input type="radio" name="urg" value="${u}" ${u==="High"?"checked":""}><span>${u}</span></label>`).join("")}</div><div class="hint">Critical means life is at risk right now.</div></div>
    <div><label for="name">Your name</label><input id="name" autocomplete="name"><div class="err" id="e-name"></div></div>
    <div><label for="phone">Phone number</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel"><div class="err" id="e-phone"></div></div>
    <div class="full"><label for="loc">Where are you?</label>
      <div class="row" style="flex-wrap:nowrap"><input id="loc" placeholder="Area, landmark, house colour, floor"><button type="button" class="btn ghost" id="gps" style="white-space:nowrap">Use my GPS</button></div>
      <div class="hint" id="gpsMsg">Add a landmark. It helps rescuers find you faster.</div><div class="err" id="e-location"></div></div>
    <div><label for="ppl">People who need help</label><input id="ppl" type="number" min="1" max="500" value="1"></div>
    <div><span class="lbl">Anyone vulnerable?</span><div class="opts">${VULN.map(v=>`<label><input type="checkbox" name="vuln" value="${v}"><span>${v}</span></label>`).join("")}</div></div>
    <div class="full"><label for="desc">What is happening?</label><textarea id="desc" placeholder="Short details: water level, injuries, supplies left…"></textarea></div>
    <div class="full row"><button class="btn" type="submit" id="send">Send request</button><span class="err" id="e-form"></span></div>
  </form>`;
}
function viewTrack(){
  const r=trackRes,idx=r?STATUS.indexOf(r.status):-1;
  return `<h1>Track request</h1><p class="lead">Enter the ID you received when you sent your request.</p>
  <form id="tf" class="row" style="margin-bottom:16px"><input id="tid" placeholder="RD-1234" value="${esc(trackId)}" style="max-width:240px" aria-label="Tracking ID"><button class="btn">Check status</button></form>
  ${trackErr?`<div class="panel err">${esc(trackErr)}</div>`:""}
  ${r?`<div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${r.id} · ${esc(r.type)}</h2><span class="badge p-${r.priority}">${r.priority} priority</span></div>
  <div class="steps">${STATUS.map((s,i)=>`<div class="${i<=idx?"done":""}">${s}</div>`).join("")}</div>
  <p style="margin:0 0 4px"><b>Assigned to:</b> ${esc(r.team)}</p><p class="meta" style="margin:0">Sent ${ago(r.created)} · last update ${ago(r.updated)}</p>
  <p style="margin:10px 0 0">${esc(r.location)}</p></div>`:""}`;
}
function viewLogin(){
  return `<h1>Responder desk</h1><p class="lead">Sign in to see and manage incoming requests.</p>
  <form id="lf" class="panel" style="max-width:380px"><label for="u">Username</label><input id="u" autocomplete="username"><div style="height:10px"></div>
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password"><div class="err" id="e-login"></div><div style="height:12px"></div><button class="btn">Sign in</button></form>`;
}
function viewDash(){
  const open=list.filter(r=>r.status!=="Resolved");
  const rows=list.filter(r=>(filter.status==="All"||(filter.status==="Open"?r.status!=="Resolved":r.status===filter.status))&&(filter.type==="All"||r.type===filter.type));
  return `<div class="row" style="justify-content:space-between"><h1>Responder desk</h1><button class="btn ghost sm" id="out">Sign out</button></div>
  <p class="lead">Requests are ranked by a priority score built from urgency, group size and vulnerable people.</p>
  ${dashErr?`<div class="panel err" style="margin-bottom:12px">${esc(dashErr)}</div>`:""}
  <div class="stats"><div class="stat"><b>${open.length}</b><span>Open requests</span></div>
  <div class="stat"><b style="color:var(--crit)">${open.filter(r=>r.priority==="Critical").length}</b><span>Critical</span></div>
  <div class="stat"><b>${list.filter(r=>r.status==="New").length}</b><span>Not yet assigned</span></div>
  <div class="stat"><b>${open.reduce((a,r)=>a+r.people,0)}</b><span>People waiting</span></div></div>
  <div class="filters"><select id="fs" aria-label="Status">${["Open","All",...STATUS].map(s=>`<option ${s===filter.status?"selected":""}>${s}</option>`).join("")}</select>
  <select id="ft" aria-label="Type">${["All",...TYPES].map(s=>`<option ${s===filter.type?"selected":""}>${s}</option>`).join("")}</select>
  <button class="btn ghost sm" id="refresh">Refresh</button><span class="note">Updates every 20 seconds</span></div>
  ${rows.length?rows.map(r=>{const ni=STATUS.indexOf(r.status)+1;return `<article class="req b-${r.priority}">
    <div class="row" style="justify-content:space-between"><h3>${esc(r.type)} · ${r.people} ${r.people==1?"person":"people"}</h3><span class="badge p-${r.priority}">${r.priority} · ${r.score}</span></div>
    <div class="meta">${r.id} · ${esc(r.name)} · <a href="tel:${esc(r.phone)}" style="color:inherit">${esc(r.phone)}</a> · ${ago(r.created)}</div>
    <p style="margin:8px 0 4px"><b>${esc(r.location)}</b></p><p style="margin:0 0 6px">${esc(r.description||"No details given.")}</p>
    <div class="tags">${r.vuln.map(v=>`<span>${esc(v)}</span>`).join("")}</div>
    <div class="row" style="margin-top:10px"><select data-team="${r.id}" style="width:auto" aria-label="Assign team for ${r.id}">${TEAMS.map(t=>`<option ${t===r.team?"selected":""}>${t}</option>`).join("")}</select>
    <span class="badge">${r.status}</span>${ni<STATUS.length?`<button class="btn sm" data-adv="${r.id}">Mark ${STATUS[ni].toLowerCase()}</button>`:""}</div></article>`}).join(""):`<div class="panel empty">No requests match these filters. Change the filters to see more.</div>`}`;
}

let timer=null;
async function loadList(){try{list=await api("/requests");dashErr=""}catch(e){dashErr=e.message}}
async function render(){
  clearTimeout(timer);
  const app=document.getElementById("app");
  if(tab==="dash"&&token){await loadList();timer=setTimeout(()=>{if(tab==="dash"&&token&&!document.activeElement?.matches("select"))render();else timer=setTimeout(render,20000)},20000)}
  app.innerHTML=tab==="request"?viewRequest():tab==="track"?viewTrack():token?viewDash():viewLogin();
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab));
  bind();
}
function bind(){
  const $=id=>document.getElementById(id);
  if(tab==="request"){
    $("goTrack")&&($("goTrack").onclick=()=>{trackId=lastId;tab="track";trackRes=null;trackErr="";doTrack()});
    $("gps").onclick=()=>{const m=$("gpsMsg");
      if(!navigator.geolocation){m.textContent="GPS is not available. Type your location instead.";return}
      m.textContent="Finding your location…";
      navigator.geolocation.getCurrentPosition(p=>{$("loc").value=($("loc").value?$("loc").value+" ":"")+"[GPS "+p.coords.latitude.toFixed(5)+", "+p.coords.longitude.toFixed(5)+"]";m.textContent="Location added. Add a landmark if you can."},
      ()=>{m.textContent="Could not get GPS. Allow location access or type your location."},{timeout:8000})};
    $("f").onsubmit=async e=>{e.preventDefault();
      ["name","phone","location","form"].forEach(k=>{const x=$("e-"+k);if(x)x.textContent=""});
      const f=new FormData($("f")),btn=$("send");btn.disabled=true;
      try{const r=await api("/requests",{method:"POST",body:{name:$("name").value,phone:$("phone").value,location:$("loc").value,type:f.get("type"),urgency:f.get("urg"),people:$("ppl").value,vuln:f.getAll("vuln"),description:$("desc").value}});
        lastId=r.id;render();window.scrollTo(0,0)}
      catch(err){btn.disabled=false;$("e-form").textContent=err.message;Object.entries(err.errors||{}).forEach(([k,v])=>{const x=$("e-"+k);if(x)x.textContent=v})}};
  }
  if(tab==="track")$("tf").onsubmit=e=>{e.preventDefault();trackId=$("tid").value;doTrack()};
  if(tab==="dash"&&!token)$("lf").onsubmit=async e=>{e.preventDefault();
    try{const r=await api("/login",{method:"POST",body:{username:$("u").value,password:$("p").value}});token=r.token;try{sessionStorage.setItem("rd-token",token)}catch(_){}render()}
    catch(err){$("e-login").textContent=err.message}};
  if(tab==="dash"&&token){
    $("out").onclick=()=>logout();$("refresh").onclick=()=>render();
    $("fs").onchange=e=>{filter.status=e.target.value;render()};$("ft").onchange=e=>{filter.type=e.target.value;render()};
    document.querySelectorAll("[data-adv]").forEach(b=>b.onclick=()=>patch(b.dataset.adv,{status:STATUS[STATUS.indexOf(list.find(x=>x.id===b.dataset.adv).status)+1]}));
    document.querySelectorAll("[data-team]").forEach(s=>s.onchange=()=>patch(s.dataset.team,{team:s.value}));
  }
}
async function patch(id,body){try{await api("/requests/"+id,{method:"PATCH",body});render()}catch(e){toast(e.message)}}
async function doTrack(){trackRes=null;trackErr="";
  try{trackRes=await api("/track/"+encodeURIComponent(trackId.trim()))}catch(e){trackErr=e.message}
  tab="track";render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();
</script>
</body>
</html>
